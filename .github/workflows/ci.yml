name: CI

on:
  pull_request:
  push:
    branches: [main]

# Batalkan proses lama pada branch/PR yang sama.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rahasia
          MARIADB_DATABASE: db_puspresma_testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: db_puspresma_testing
      DB_USERNAME: root
      DB_PASSWORD: rahasia
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, gd, bcmath, pcntl, pdo_mysql, zip, exif
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate
      - run: npm ci && npm run build
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=1G
      - run: php artisan test

  # Deploy hanya setelah uji hijau, dan hanya untuk push ke main (bukan PR).
  # Server menarik kode sendiri (fetch + reset) lalu menjalankan skrip rilis yang ikut repo.
  deploy:
    name: Deploy ke produksi
    runs-on: ubuntu-latest
    needs: [uji]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Jangan dibatalkan di tengah migrasi/recreate; rilis berikutnya mengantre.
    concurrency:
      group: deploy-produksi
      cancel-in-progress: false

    steps:
      - name: Tarik kode dan rilis via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '~/docker-apps/puspresma' }}
            git fetch --prune origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
