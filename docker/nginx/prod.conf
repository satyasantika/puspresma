# Nginx aplikasi di belakang reverse proxy fakultas. Proxy boleh memotong awalan subpath (disarankan) atau meneruskannya;
# awalan diturunkan dari APP_URL oleh 10-awalan.sh (lihat docs/DEPLOY.md §3).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;   # index.html untuk public/panduan/

    server_tokens off;

    include /etc/nginx/awalan.conf;
    client_max_body_size 11m;   # hanya impor Excel/CSV; aplikasi tidak menerima unggahan berkas

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # tidak ada berkas pengguna di server (BERKAS_MODE=tautan)
    location ^~ /storage/ { return 404; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 90s;
        include fastcgi_params;
    }

    # aset Vite bernama-hash: cache panjang
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|woff2?|ico|css|js)$ {
        expires 7d;
        access_log off;
    }

    # berkas tersembunyi dan sumber tidak pernah disajikan
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:env|log|sql|bak|md|lock)$ { deny all; }
}
