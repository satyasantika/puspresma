# Produksi Puspresma FKIP (pola docker-apps).
#   cp .env.production.example .env   → isi rahasia (jangan commit .env)
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
# Basis data MariaDB/MySQL berjalan native di host (DB_HOST=host.docker.internal); profil `db-lokal` hanya untuk uji coba.
name: puspresma

x-app: &app
  image: puspresma-app:${PUSPRESMA_VERSI:-latest}
  env_file: .env
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]
  networks: [internal]
  volumes:
    - storage:/var/www/html/storage
  environment:
    PHP_MEMORY_LIMIT: 512M

services:
  app:
    <<: *app
    build:
      context: .
      target: app
      args:
        ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/puspresma}
        APP_VERSION: ${APP_VERSION:-0.0.0}   # build: APP_VERSION=$(git describe --tags) docker compose ... build
    environment:
      PHP_MEMORY_LIMIT: 512M
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}   # hanya container app yang boleh bermigrasi
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(file_exists(\"/var/www/html/vendor/autoload.php\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: puspresma-web:${PUSPRESMA_VERSI:-latest}
    build:
      context: .
      target: web
      args:
        ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/puspresma}
    restart: unless-stopped
    depends_on: [app]
    environment:
      APP_URL: ${APP_URL:?APP_URL wajib diisi di .env}   # awalan subpath diturunkan dari sini
    # Hanya loopback: reverse proxy fakultas yang membuka ke publik (TLS di sana).
    ports: ["127.0.0.1:${HTTP_PORT:-8032}:80"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/api/health | grep -q \"ok\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue:
    <<: *app
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    depends_on: [redis]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?isi REDIS_PASSWORD di .env}"]
    volumes: [redis-data:/data]
    networks: [internal]

  # Cadangan terjadwal: dipanggil host (cron/systemd) — lihat docs/DEPLOY.md §6.
  backup:
    image: mariadb:10.11
    profiles: ["backup"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./docker/backup:/skrip:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh"]
    command: ["/skrip/backup.sh"]
    networks: [internal]

  # Hanya untuk uji coba bila tidak ada basis data host.
  db:
    image: mariadb:10.11
    profiles: ["db-lokal"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-db_puspresma}
      MARIADB_USER: ${DB_USERNAME:-app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes: [db-data:/var/lib/mysql]
    networks: [internal]

networks:
  internal: {}

volumes:
  storage: {}
  redis-data: {}
  db-data: {}
